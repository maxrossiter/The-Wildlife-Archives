const req=indexedDB.open(DB,2);req.onupgradeneeded=e=>{let d=e.target.result;for(const n of ['visits','sightings','checks','photos','collections'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})};req.onerror=()=>alert('Local storage could not be opened.');req.onsuccess=async e=>{db=e.target.result;await reload();render()};function all(n){return new Promise((resolve,reject)=>{let r=db.transaction(n).objectStore(n).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function put(n,o){return new Promise((resolve,reject)=>{let r=db.transaction(n,'readwrite').objectStore(n).put(o);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}function del(n,id){return new Promise((resolve,reject)=>{let r=db.transaction(n,'readwrite').objectStore(n).delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}async function reload(){[visits,sightings,checks,photos,collections]=await Promise.all(['visits','sightings','checks','photos','collections'].map(all))}async function save(n,o){await put(n,o);await reload();render();toast('Saved to this device')}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}const trip={id:'south-africa-2027',name:'South Africa Expedition',date:'2027-03-03',end:'2027-03-19',type:'trip'};const vById=id=>id===trip.id?trip:visits.find(v=>v.id===id);const ss=id=>sightings.filter(s=>s.visitId===id);const ps=id=>photos.filter(p=>p.sightingId===id);const years=()=>[...new Set([2026,2027,...visits.map(v=>Number(v.date.slice(0,4)))])].sort((a,b)=>b-a);function date(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}function nav(t,v=null){tab=t;view=v;search='';filter='all';render();scrollTo(0,0)}function btn(label,fn,primary=false){return `<button class="action ${primary?'primary':''}" onclick="${fn}">${label}</button>`}function render(){if(!db)return;const ts=[['home','Overview'],['collections','Collections'],['journal','Zoo journal'],['species','Species directory'],['safari','South Africa'],['backup','Backups']];$('tabs').innerHTML=ts.map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="nav('${id}')">${n}</button>`).join('');let h='';if(tab==='home'){let unique=new Set(sightings.map(s=>s.species.toLowerCase()));h=`<div class="card"><h2>Field journal overview</h2><div class="grid"><div class="stat"><strong>${visits.length}</strong><small>Zoo visits</small></div><div class="stat"><strong>${new Set(visits.map(v=>v.zoo.toLowerCase())).size}</strong><small>Zoos</small></div><div class="stat"><strong>${unique.size}</strong><small>Species</small></div><div class="stat"><strong>${photos.length}</strong><small>Photographs</small></div></div></div><div class="card"><h2>Recent field notes</h2>${visits.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(v=>`<div class="item"><button class="link" onclick="nav('journal',{kind:'visit',id:'${v.id}'})">${esc(v.zoo)} · ${date(v.date)}</button><div class="muted">${ss(v.id).length} animal records</div></div>`).join('')||'<div class="empty">Your archive begins with your first visit.</div>'}${btn('+ Log zoo visit',"nav('journal',{kind:'newvisit'})",true)}</div><div class="card"><h2>2027 · South Africa</h2><p>3–19 March · Cape Town, Cape Peninsula, Marloth Park and Kruger National Park</p>${btn('Open expedition',"nav('safari')",true)}</div>`}
if(tab==='collections')h=collectionPage();if(tab==='journal')h=journal();if(tab==='species')h=speciesPage();if(tab==='safari')h=safari();if(tab==='backup')h=backupPage();$('content').innerHTML=h}
function journal(){if(view?.kind==='newvisit')return `<button class="back" onclick="nav('journal')">← All visits</button><div class="card"><h2>New zoo visit</h2><form onsubmit="addVisit(event)"><label class="field">Zoo or wildlife park<input name="zoo" required placeholder="Port Lympne Reserve" list="zooNames"></label>${zooDatalist()}<label class="field">Date<input type="date" name="date" value="${today()}" required></label><label class="field">Visit notes<textarea name="notes" placeholder="Weather, highlights, companions, conditions..."></textarea></label><button class="action primary">Create visit</button></form></div>`;if(view?.kind==='visit')return visitPage(view.id);if(view?.kind==='animal')return animalPage(view.id);if(view?.kind==='year')return yearPage(view.year);if(view?.kind==='zoo')return zooPage(view.year,view.zoo);return `<div class="card"><h2>Zoo journal</h2><p class="muted">Browse by year → zoo → visit date → animal record.</p>${btn('+ New visit',"nav('journal',{kind:'newvisit'})",true)}</div>${years().map(y=>`<div class="card"><div class="item"><button class="link" onclick="nav('journal',{kind:'year',year:${y}})">📁 ${y} — ${visits.filter(v=>v.date.startsWith(y)).length} zoo visits</button></div></div>`).join('')}`}
function yearPage(y){let vs=visits.filter(v=>v.date.startsWith(y));let zoos=[...new Set(vs.map(v=>v.zoo))];return `<button class="back" onclick="nav('journal')">← Years</button><div class="card"><h2>${y} · Zoo archive</h2>${zoos.map(z=>`<div class="item"><button class="link" onclick="nav('journal',{kind:'zoo',year:${y},zoo:${JSON.stringify(z).replace(/"/g,'&quot;')}})">📁 ${esc(z)}</button><div class="muted">${vs.filter(v=>v.zoo===z).length} visits</div></div>`).join('')||'<p>No visits recorded yet.</p>'}${btn('+ Add visit',"nav('journal',{kind:'newvisit'})",true)}</div>`}
function zooPage(y,z){return `<button class="back" onclick="nav('journal',{kind:'year',year:${y}})">← ${y}</button><div class="card"><h2>${esc(z)}</h2>${visits.filter(v=>v.zoo===z&&v.date.startsWith(y)).sort((a,b)=>b.date.localeCompare(a.date)).map(v=>`<div class="item"><button class="link" onclick="nav('journal',{kind:'visit',id:'${v.id}'})">${date(v.date)}</button><div class="muted">${ss(v.id).length} animal records · ${esc(v.notes||'')}</div></div>`).join('')}</div>`}

async function updateCollection(z,items){let id=collectionId(z),c=collections.find(x=>x.id===id);await put('collections',{id,name:c?.name||z,species:[...new Set(items.map(x=>x.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b)),updatedAt:new Date().toISOString(),source:c?.source||'Personal editable checklist',excludedSpecies:c?.excludedSpecies||[]});await reload();render()}
async function addCollectionSpecies(z,name){let arr=collectionSpecies(z),c=collections.find(x=>x.id===collectionId(z));await updateCollection(z,[...arr,name]);if(c?.excludedSpecies?.some(s=>s.toLowerCase()===name.toLowerCase())){let latest=collections.find(x=>x.id===collectionId(z));await put('collections',{...latest,excludedSpecies:(latest.excludedSpecies||[]).filter(s=>s.toLowerCase()!==name.toLowerCase())});await reload();render()}}
async function removeCollectionSpecies(z,name){if(!confirm('Permanently remove '+name+' from this collection checklist? Existing sightings and photos will be kept.'))return;let id=collectionId(z),c=collections.find(x=>x.id===id),items=collectionSpecies(z).filter(x=>x.toLowerCase()!==name.toLowerCase()),excluded=[...new Set([...(c?.excludedSpecies||[]),name])];await put('collections',{id,name:c?.name||z,species:items,excludedSpecies:excluded,updatedAt:new Date().toISOString(),source:c?.source||'Personal editable checklist'});await reload();render();toast('Removed from checklist')}
async function mergePublishedSpecies(z){let latest=zooLists[zooKey(z)]||[];if(!latest.length){alert('No published starter list available for this collection yet.');return;}let old=collectionSpecies(z),added=latest.filter(n=>!old.some(x=>x.toLowerCase()===n.toLowerCase()));if(!added.length){alert('No new species to merge.');return;}if(!confirm('Add '+added.length+' species from the published starter list to '+z+'? Your own species and historical photos will remain.'))return;await updateCollection(z,[...old,...added]);let c=collections.find(x=>x.id===collectionId(z));if(c?.excludedSpecies?.length){await put('collections',{...c,excludedSpecies:[]});await reload();render()}alert(added.length+' species added.');}

async function importCollection(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.format!=='wildlife-archives-collection'||!Array.isArray(d.species)||typeof d.zoo!=='string'||d.species.length>10000||d.species.some(x=>typeof x!=='string'||x.length>160))throw Error('Invalid collection file');let zoo=d.zoo.slice(0,120),existing=collectionSpecies(zoo);let mode=confirm('Merge shared species into '+zoo+'? OK = merge; Cancel = replace entire checklist (after another confirmation).');if(!mode&&!confirm('Replace the entire master checklist for '+zoo+'? Your existing visit records and photos will remain.'))return;await updateCollection(zoo,mode?[...existing,...d.species]:d.species);if(!mode){let c=collections.find(x=>x.id===collectionId(zoo)),chosen=new Set(d.species.map(s=>s.toLowerCase())),published=zooLists[zooKey(zoo)]||[];await put('collections',{...c,excludedSpecies:published.filter(s=>!chosen.has(s.toLowerCase()))});await reload()}nav('collections',{zoo});toast('Shared checklist imported')}catch(err){alert('Could not import collection: '+err.message)}e.target.value=''}

sts may not include every animal.`:'No verified official species list imported for this collection yet.'}</p><p class="muted">For an official zoo directory, consult <a href="https://biaza.org.uk/members/all" target="_blank" rel="noopener">BIAZA</a>. Cross-check holdings with <a href="https://www.zootierliste.de/en/" target="_blank" rel="noopener">Zootierliste</a>. This app does not automatically import or synchronise its database. For an example of official comprehensive inventories, see <a href="https://www.chesterzoo.org/footer/corporate-information/animal-inventory" target="_blank" rel="noopener">Chester Zoo annual inventories</a>.</p><form onsubmit="collectionAdd(event,${JSON.stringify(z).replace(/"/g,'&quot;')})" class="toolbar"><input name="species" required placeholder="Add species permanently" style="flex:1;min-width:150px;padding:12px"><button class="action primary">+ Add</button></form>${btn('Merge published species updates',`mergePublishedSpecies(${JSON.stringify(z).replace(/"/g,'&quot;')})`)}${btn('Share checklist file',`shareCollection(${JSON.stringify(z).replace(/"/g,'&quot;')})`)}<input class="search" placeholder="Search checklist" oninput="filterCollectionSpecies(this.value)" style="margin-top:12px"><div id="collectionSpeciesRows">${collectionRows(z,items)}</div></div>`}

function filterCollectionRows(q){for(let r of document.querySelectorAll('#collectionRows .item'))r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none'}
function filterCollectionSpecies(q){for(let r of document.querySelectorAll('#collectionSpeciesRows .item'))r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none'}

function visitPage(id){let v=vById(id);if(!v)return '<p>Visit not found</p>';let isTrip=v.type==='trip',key=isTrip?null:zooKey(v.zoo),listed=isTrip?starter.map(x=>x[1]):collectionSpecies(v.zoo),names=[...new Set([...listed,...ss(id).map(x=>x.species)])].sort((a,b)=>a.localeCompare(b));let rows=names.map(n=>{let s=ss(id).find(x=>x.species.toLowerCase()===n.toLowerCase()),q=JSON.stringify(n).replace(/"/g,'&quot;');return `<div class="item"><div style="display:flex;align-items:center;gap:10px"><input type="checkbox" style="width:22px;height:22px;accent-color:#315340" ${s?'checked':''} onchange="toggleVisitSpecies('${id}',${q},this.checked)"><strong style="flex:1">${esc(n)}</strong>${s?`<label class="action" style="font-size:13px;margin:0">📷 Add photos<input type="file" accept="image/*" multiple style="display:none" onchange="uploadPhotos(event,'${s.id}')"></label>`:''}</div>${s?`<div class="muted">${ps(s.id).length} photo(s) · ${esc(s.notes||'')}</div>${thumbs(s.id)}<button class="chip" onclick="editComment('${s.id}')">${s.notes?'Edit comment':'+ Optional comment'}</button>`:''}</div>`}).join('');return `<button class="back" onclick="${isTrip?"nav('safari')":`nav('journal',{kind:'zoo',year:${v.date.slice(0,4)},zoo:${JSON.stringify(v.zoo).replace(/"/g,'&quot;')}})`}">← Back</button><div class="card"><h2>${esc(v.zoo||v.name)}</h2><div class="muted">${isTrip?'3–19 March 2027':date(v.date)} · ${ss(id).length} species ticked · ${ss(id).reduce((n,s)=>n+ps(s.id).length,0)} photographs</div></div><div class="card"><h2>Species checklist</h2><p class="muted">Tick a species, then tap 📷 Add photos to select pictures from your iPhone. Notes are optional.</p><p class="muted">Your editable master checklist is shared across visits. Holdings can change; verify against Zootierliste and zoo information.</p>${btn('Edit this collection',`nav('collections',{zoo:${JSON.stringify(v.zoo).replace(/"/g,'&quot;')}})`)}<input class="search" placeholder="Filter species" oninput="filterVisitRows(this.value)"><div id="visitRows">${rows||'<p>No verified species inventory loaded for this zoo yet. Add species manually below; do not treat an empty checklist as an empty collection.</p>'}</div><form onsubmit="addQuickSpecies(event,'${id}')" class="toolbar"><input name="species" required placeholder="Add another species" style="flex:1;min-width:130px;padding:12px;border:1px solid #aaa;border-radius:7px"><button class="action primary">+ Add</button></form></div>`}
async function toggleVisitSpecies(id,name,on){let old=ss(id).find(s=>s.species.toLowerCase()===name.toLowerCase());if(on&&!old){let v=vById(id);await put('sightings',{id:uid(),visitId:id,species:name,date:v.date,notes:'',location:'',count:1});}else if(!on&&old){if(ps(old.id).length&&!confirm('This species has photos. Remove its record and all attached photos?')){render();return}for(let p of ps(old.id))await del('photos',p.id);await del('sightings',old.id)}await reload();render()}
async function addQuickSpecies(e,id){e.preventDefault();let name=new FormData(e.target).get('species').trim();if(name){let v=vById(id);if(v.type!=='trip')await addCollectionSpecies(v.zoo,name);await toggleVisitSpecies(id,name,true)}}
async function editComment(id){let s=sightings.find(x=>x.id===id);let notes=prompt('Optional comment (e.g. animal name)',s.notes||'');if(notes!==null)await save('sightings',{...s,notes})}
function filterVisitRows(value){for(let row of document.querySelectorAll('#visitRows .item'))row.style.display=row.querySelector('strong')?.textContent.toLowerCase().includes(value.toLowerCase())?'':'none'}
function datalist(){return `<datalist id="knownSpecies">${[...new Set([...starter.map(x=>x[1]),...sightings.map(s=>s.species)])].map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`}function thumbs(id){return `<div class="photos">${ps(id).map(p=>`<img src="${URL.createObjectURL(p.blob)}" alt="Wildlife photograph" onclick="window.open(this.src,'_blank')">`).join('')}</div>`}
function animalPage(id){let s=sightings.find(x=>x.id===id);if(!s)return '<p>Not found</p>';let v=vById(s.visitId);return `<button class="back" onclick="${v.type==='trip'?"nav('safari',{kind:'records'})":`nav('journal',{kind:'visit',id:'${v.id}'})`}">← Back to records</button><div class="card"><small class="muted">SPECIMEN / FIELD OBSERVATION</small><h2>${esc(s.species)}</h2><p><strong>${esc(s.individual||'Unnamed individual')}</strong></p><div class="muted">${date(s.date||v.date)} · ${esc(s.location||v.zoo||v.name)} · ${s.count||1} observed</div><p>${esc(s.notes||'No field notes yet.')}</p>${thumbs(id)}<label class="field">Attach photographs<input type="file" accept="image/*" multiple onchange="uploadPhotos(event,'${id}')"></label><p class="muted">Photos are stored locally on this device. Export backups regularly.</p>${btn('Edit record',`editAnimal('${id}')`)}${btn('Delete record',`deleteAnimal('${id}')`)}</div>`}
async function addVisit(e){e.preventDefault();let f=new FormData(e.target),o={id:uid(),zoo:String(f.get('zoo')).trim(),date:f.get('date'),notes:f.get('notes')};await save('visits',o);nav('journal',{kind:'visit',id:o.id})}async function addSighting(e,id){e.preventDefault();let f=new FormData(e.target),v=vById(id),o={id:uid(),visitId:id,species:String(f.get('species')).trim(),individual:f.get('individual'),location:f.get('location'),count:Number(f.get('count'))||1,notes:f.get('notes'),date:f.get('date')||v.date};await save('sightings',o);if(id===trip.id){await setCheck(o.species,true);nav('safari',{kind:'records'})}else nav('journal',{kind:'visit',id})}async function uploadPhotos(e,id){let files=[...e.target.files];for(let f of files){if(!f.type.startsWith('image/'))continue;await put('photos',{id:uid(),sightingId:id,name:f.name,blob:f,lastModified:f.lastModified})}await reload();render();toast(`${files.length} photo(s) attached`)}async function deleteAnimal(id){if(!confirm('Delete this animal record and all its photos?'))return;for(let p of ps(id))await del('photos',p.id);await del('sightings',id);await reload();nav('species')}async function editAnimal(id){let s=sightings.find(x=>x.id===id);let individual=prompt('Individual name',s.individual||'');if(individual===null)return;let location=prompt('Location / enclosure',s.location||'');if(location===null)return;let notes=prompt('Field notes',s.notes||'');if(notes===null)return;await save('sightings',{...s,individual,location,notes})}
function speciesPage(){let names=[...new Set(sightings.map(s=>s.species))].sort();let matches=names.filter(n=>n.toLowerCase().includes(search.toLowerCase()));return `<div class="card"><h2>Species directory</h2><p class="muted">Every recorded species, across all visits and expeditions.</p><input class="search" placeholder="Search species" value="${esc(search)}" oninput="search=this.value;updateSpecies()"><div id="speciesResults">${speciesResults(matches)}</div></div>`}function speciesResults(names){return names.map(n=>{let records=sightings.filter(s=>s.species===n),places=[...new Set(records.map(s=>vById(s.visitId)?.zoo||vById(s.visitId)?.name))];return `<div class="item"><strong>${esc(n)}</strong><div class="muted">${records.length} observations · ${esc(places.join(', '))}</div>${records.map(s=>`<button class="chip" onclick="nav('journal',{kind:'animal',id:'${s.id}'})">${date(s.date)} · ${esc(s.location||'View record')}</button>`).join('')}</div>`}).join('')||'<div class="empty">No matching species yet.</div>'}function updateSpecies(){let names=[...new Set(sightings.map(s=>s.species))].sort().filter(n=>n.toLowerCase().includes(search.toLowerCase()));$('speciesResults').innerHTML=speciesResults(names)}
function checked(n){return checks.some(c=>c.name.toLowerCase()===n.toLowerCase()&&c.done)}async function setCheck(n,done){let old=checks.find(c=>c.name.toLowerCase()===n.toLowerCase());await put('checks',{id:old?.id||uid(),name:n,done});await reload();render()}function safari(){if(view?.kind==='records')return `<button class="back" onclick="nav('safari')">← Expedition</button>${visitPage(trip.id).replace('<button class="back" onclick="nav(\'safari\')">← Back</button>','')}`;let allNames=[...new Set([...starter.map(x=>x[1]),...checks.map(c=>c.name),...ss(trip.id).map(s=>s.species)])].sort();let count=allNames.filter(checked).length;let shown=allNames.filter(n=>(filter==='all'||(filter==='seen'?checked(n):filter==='unseen'?!checked(n):starter.some(x=>x[0]===filter&&x[1]===n)))&&n.toLowerCase().includes(search.toLowerCase()));return `<div class="card"><small class="muted">EXPEDITION NO. 001 · 2027</small><h2>South Africa Field Expedition</h2><p>3–19 March 2027 · Cape Town, Cape Peninsula, Marloth Park and Kruger National Park</p><div class="grid"><div class="stat"><strong>${count}</strong><small>Checklist ticks</small></div><div class="stat"><strong>${allNames.length}</strong><small>Possible species</small></div><div class="stat"><strong>${ss(trip.id).length}</strong><small>Field records</small></div><div class="stat"><strong>${ss(trip.id).reduce((n,s)=>n+ps(s.id).length,0)}</strong><small>Photos</small></div></div><p class="muted">The checklist is a starting guide, not a guarantee of sightings. You can add any other species.</p>${btn('+ Record a sighting',"nav('safari',{kind:'records'})",true)}${btn('View field records',"nav('safari',{kind:'records'})")}</div><div class="card"><h2>Wildlife checklist</h2><input class="search" placeholder="Search species" value="${esc(search)}" oninput="search=this.value;updateChecklist()"><div class="toolbar" style="margin-top:10px">${['all','seen','unseen','Mammals','Birds','Reptiles','Marine life'].map(f=>`<button class="chip ${filter===f?'primary':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div><form onsubmit="addCustom(event)" class="toolbar" style="margin-top:12px"><input name="name" required placeholder="Add another species" style="flex:1;min-width:130px;padding:10px;border:1px solid #aaa;border-radius:7px"><button class="action">Add</button></form><div id="checkResults">${checkRows(shown)}</div></div>`}function checkRows(names){return names.map(n=>`<div class="checkrow"><input aria-label="Seen ${esc(n)}" type="checkbox" ${checked(n)?'checked':''} onchange="setCheck(${JSON.stringify(n).replace(/"/g,'&quot;')},this.checked)"><span>${esc(n)}</span>${ss(trip.id).some(s=>s.species.toLowerCase()===n.toLowerCase())?'<span class="pill">📷 Recorded</span>':''}</div>`).join('')||'<p class="muted">No matching species.</p>'}function updateChecklist(){let names=[...new Set([...starter.map(x=>x[1]),...checks.map(c=>c.name),...ss(trip.id).map(s=>s.species)])].sort().filter(n=>(filter==='all'||(filter==='seen'?checked(n):filter==='unseen'?!checked(n):starter.some(x=>x[0]===filter&&x[1]===n)))&&n.toLowerCase().includes(search.toLowerCase()));$('checkResults').innerHTML=checkRows(names)}async function addCustom(e){e.preventDefault();let n=new FormData(e.target).get('name').trim();if(n)await setCheck(n,false)}
function backupPage(){return `<div class="card"><h2>Backups & offline use</h2><div class="notice"><strong>Important:</strong> Records and full-size photos live in this browser's IndexedDB on this device. They are not synced to iCloud or other devices. Export backups frequently, especially after adding photographs. Removing website data can erase your archive.</div><p>Export a complete JSON backup including embedded photo data, or restore from a previously exported backup.</p>${btn('Export complete backup',"exportBackup()",true)}<label class="field">Restore backup (replaces current archive)<input type="file" accept="application/json,.json" onchange="importBackup(event)"></label><p class="muted">Large photo collections may create very large backup files. Save exports to the Files app or iCloud Drive.</p></div><div class="card"><h2>Install on iPhone</h2><p>Once hosted on an HTTPS website, open the app in Safari, tap Share, then choose <strong>Add to Home Screen</strong>. After the first successful load, the app shell can open offline. Data and photos remain on your device.</p><p class="muted">Opening index.html directly from the Files app is not a reliable way to install a PWA. Hosting is required.</p></div>`}async function exportBackup(){let out={format:'wildlife-archives',version:1,exportedAt:new Date().toISOString(),visits,sightings,checks,collections,photos:[]};for(let p of photos){let b64=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(p.blob)});out.photos.push({id:p.id,sightingId:p.sightingId,name:p.name,lastModified:p.lastModified,data:b64})}let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));a.href=url;a.download=`wildlife-archives-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Backup generated — save it somewhere safe')}async function importBackup(e){let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(d.format!=='wildlife-archives'||d.version!==1||!Array.isArray(d.visits)||!Array.isArray(d.sightings)||!Array.isArray(d.checks)||!Array.isArray(d.photos))throw Error('Invalid backup format');if(!confirm('Replace ALL current records and photos with this backup?'))return;let restored=d.photos.map(p=>{let [meta,b64]=p.data.split(','),mime=meta.match(/data:(.*?);base64/)?.[1]||'image/jpeg',bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return {id:p.id,sightingId:p.sightingId,name:p.name,lastModified:p.lastModified,blob:new Blob([bytes],{type:mime})}});for(let n of ['visits','sightings','checks','photos','collections']){await new Promise((resolve,reject)=>{let r=db.transaction(n,'readwrite').objectStore(n).clear();r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}for(let [n,arr] of [['visits',d.visits],['sightings',d.sightings],['checks',d.checks],['collections',d.collections||[]],['photos',restored]])for(let item of arr)await put(n,item);await reload();nav('home');toast('Backup restored')}catch(err){alert('Could not restore backup: '+err.message)}}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
